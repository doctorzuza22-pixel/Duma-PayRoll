/* Personal appearance and low-vision accessibility */
:root{--duma-scale:1;--duma-bg:#f4f6f8;--duma-surface:#fff;--duma-text:#182230;--duma-muted:#657286;--duma-accent:#172235;--duma-border:#dfe4ea}
body{font-size:calc(14px * var(--duma-scale));background:var(--duma-bg);color:var(--duma-text)}
.side{background:var(--duma-accent)}.main,.content{color:var(--duma-text)}.card,.top,.field{background:var(--duma-surface);color:var(--duma-text)}
body[data-theme="dark"]{--duma-bg:#10151e;--duma-surface:#1b2431;--duma-text:#f2f5f9;--duma-muted:#c1cad6;--duma-accent:#080d15;--duma-border:#3b4859;color-scheme:dark}
body[data-theme="blue"]{--duma-bg:#edf4ff;--duma-surface:#fff;--duma-text:#102b50;--duma-muted:#49627f;--duma-accent:#123d70;--duma-border:#cbdcf2}
body[data-theme="logo"]{--duma-bg:#f3f5f7;--duma-surface:#fff;--duma-text:#182230;--duma-muted:#5f6c7c;--duma-accent:#111827;--duma-border:#d8dee6}
body[data-theme="light"]{--duma-bg:#fff;--duma-surface:#fff;--duma-text:#111827;--duma-muted:#4b5563;--duma-accent:#1f2937;--duma-border:#cbd5e1}
body[data-theme="dark"] .top,body[data-theme="dark"] .card,body[data-theme="dark"] .field{border-color:var(--duma-border)}
body[data-theme="dark"] .crumb,body[data-theme="dark"] .welcome p,body[data-theme="dark"] .module p,body[data-theme="dark"] .row small{color:var(--duma-muted)}
body[data-theme="dark"] .module,body[data-theme="dark"] .module strong,body[data-theme="dark"] .section-head h2{color:var(--duma-text)}
body[data-large-controls="true"] button,body[data-large-controls="true"] .field{min-height:48px;padding:13px;font-size:calc(1em * var(--duma-scale))}
body[data-high-contrast="true"]{--duma-muted:#263445;--duma-border:#697789}body[data-theme="dark"][data-high-contrast="true"]{--duma-muted:#fff;--duma-border:#fff}
body{font-size:calc(14px * var(--duma-scale))}.welcome h1{font-size:calc(26px * var(--duma-scale))}.module strong,.module p,.module em,.nav button,.row strong,.row small{font-size:calc(1em * var(--duma-scale))}
.settings-group{margin:14px 0;padding:16px;border:1px solid var(--duma-border);border-radius:9px;background:var(--duma-surface)}.settings-group h2{font-size:14px;margin:0 0 8px}.settings-group p{font-size:12px;color:var(--duma-muted);line-height:1.5}.setting-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--duma-border);font-size:12px}.setting-row select,.setting-row input{font:inherit;padding:9px;border:1px solid var(--duma-border);border-radius:7px;background:var(--duma-surface);color:var(--duma-text)}.setting-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Contrast corrections for every appearance theme */
body[data-theme="dark"] .welcome h1,

body[data-theme="dark"] .card,
body[data-theme="dark"] .field,

body[data-theme="blue"] .welcome h1,
